repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        additional_dependencies: [ "--index-url", "https://pypi.tuna.tsinghua.edu.cn/simple" ]
      - id: end-of-file-fixer
        additional_dependencies: [ "--index-url", "https://pypi.tuna.tsinghua.edu.cn/simple" ]
      - id: trailing-whitespace
        additional_dependencies: [ "--index-url", "https://pypi.tuna.tsinghua.edu.cn/simple" ]
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args:
          - --line-length=120
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        args:
          - --max-line-length=120
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: [ "--profile", "black", "--filter-files" ]
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.43.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [ commit ]
        additional_dependencies: [ "--index-url", "https://pypi.tuna.tsinghua.edu.cn/simple" ]
